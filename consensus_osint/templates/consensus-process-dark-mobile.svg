<svg xmlns="http://www.w3.org/2000/svg" width="400" height="1080" viewBox="0 0 400 1080" role="img" aria-labelledby="title desc">
<title id="title">How Consensus combines and maintains 19 source projects</title>
<desc id="desc">Nineteen source projects listed 12,356 modules and rules in the 3 October snapshot, including overlaps. Consensus has 9,778 enabled modules and rules in the 16 October inventory after expert review, testing and integration. These are inventory snapshots, not measured batch throughput. Experts target a weekly review cadence. A default query selects relevant modules, removes duplicate routes and presents unified results.</desc>
<rect width="400" height="1080" rx="18" fill="#0d1117"/>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#f58a45" stroke-width="1.5"/></marker></defs>
<g font-family="Segoe UI, Helvetica, Arial, sans-serif">
<text x="24" y="32" font-size="14" fill="#f58a45" font-weight="700" text-anchor="start">HOW CONSENSUS WORKS</text>
<rect x="24" y="54" width="352" height="120" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="200" y="85" font-size="20" fill="#f0f3f6" font-weight="650" text-anchor="middle">19 source projects</text>
<text x="200" y="127" font-size="32" fill="#f58a45" font-weight="700" text-anchor="middle">12,356</text>
<text x="200" y="151" font-size="13" fill="#a8b3c0" font-weight="400" text-anchor="middle">listed modules and rules*</text>
<path d="M200 181L200 199" fill="none" stroke="#f58a45" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="24" y="207" width="352" height="175" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="42" y="240" font-size="20" fill="#f0f3f6" font-weight="650" text-anchor="start">Expert review</text>
<text x="42" y="274" font-size="12" fill="#f58a45" font-weight="700" text-anchor="start">01</text>
<text x="72" y="274" font-size="14" fill="#f0f3f6" font-weight="400" text-anchor="start">Test and improve</text>
<text x="42" y="301" font-size="12" fill="#f58a45" font-weight="700" text-anchor="start">02</text>
<text x="72" y="301" font-size="14" fill="#f0f3f6" font-weight="400" text-anchor="start">Standardise results</text>
<text x="42" y="328" font-size="12" fill="#f58a45" font-weight="700" text-anchor="start">03</text>
<text x="72" y="328" font-size="14" fill="#f0f3f6" font-weight="400" text-anchor="start">Remove duplicates</text>
<text x="42" y="355" font-size="12" fill="#f58a45" font-weight="700" text-anchor="start">04</text>
<text x="72" y="355" font-size="14" fill="#f0f3f6" font-weight="400" text-anchor="start">Integrate modules</text>
<path d="M200 389L200 407" fill="none" stroke="#f58a45" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="24" y="415" width="352" height="130" rx="12" fill="#161b22" stroke="#f58a45" stroke-width="2"/>
<text x="42" y="449" font-size="20" fill="#f0f3f6" font-weight="650" text-anchor="start">Consensus</text>
<text x="42" y="497" font-size="32" fill="#f58a45" font-weight="700" text-anchor="start">9,778</text>
<text x="164" y="483" font-size="13" fill="#a8b3c0" font-weight="400" text-anchor="start">enabled modules and rules</text>
<text x="164" y="507" font-size="13" fill="#f0f3f6" font-weight="600" text-anchor="start">One maintained tool</text>
<text x="24" y="574" font-size="11" fill="#a8b3c0" font-weight="400" text-anchor="start">* Counts include overlaps and declared routes.</text>
<text x="24" y="592" font-size="11" fill="#a8b3c0" font-weight="400" text-anchor="start">Mailcat is separate; SherlockV2 is unverified.</text>
<text x="24" y="610" font-size="11" fill="#a8b3c0" font-weight="400" text-anchor="start">Snapshots: sources 3 Oct; Consensus 16 Oct 2026.</text>
<rect x="24" y="632" width="352" height="208" rx="12" fill="#261d17" stroke="#f58a45" stroke-width="2"/>
<text x="200" y="662" font-size="16" fill="#f58a45" font-weight="700" text-anchor="middle">EXPERT REVIEW · WEEKLY TARGET</text>
<text x="200" y="683" font-size="13" fill="#f0f3f6" font-weight="600" text-anchor="middle">by our experts</text>
