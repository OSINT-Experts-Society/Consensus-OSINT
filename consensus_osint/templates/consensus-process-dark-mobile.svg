<text x="292" y="719" font-size="12" fill="#f0f3f6" font-weight="600" text-anchor="middle">Identify changes</text>
<text x="284" y="739" font-size="10" fill="#a8b3c0" font-weight="400" text-anchor="middle">Find updates</text>
<rect x="36" y="756" width="160" height="53" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
