<text x="124" y="776" font-size="12" fill="#f0f3f6" font-weight="600" text-anchor="middle">Expert review</text>
<text x="116" y="796" font-size="10" fill="#a8b3c0" font-weight="400" text-anchor="middle">Test and deduplicate</text>
<rect x="204" y="756" width="160" height="53" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="213" y="776" font-size="10" fill="#f58a45" font-weight="700" text-anchor="start">04</text>
<text x="292" y="776" font-size="12" fill="#f0f3f6" font-weight="600" text-anchor="middle">Update Consensus</text>
<text x="284" y="796" font-size="10" fill="#a8b3c0" font-weight="400" text-anchor="middle">Integrate and retire</text>
<text x="200" y="828" font-size="10" fill="#a8b3c0" font-weight="400" text-anchor="middle">New modules integrated. Broken modules retired.</text>
<text x="24" y="875" font-size="14" fill="#f58a45" font-weight="700" text-anchor="start">HOW YOUR QUERY RUNS</text>
<text x="376" y="875" font-size="12" fill="#a8b3c0" font-weight="400" text-anchor="end">Default search</text>
<rect x="24" y="896" width="172" height="58" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
