<text x="290" y="940" font-size="10" fill="#a8b3c0" font-weight="400" text-anchor="middle">Relevant modules</text>
<rect x="24" y="966" width="172" height="58" rx="12" fill="#161b22" stroke="#f58a45" stroke-width="2"/>
<text x="110" y="989" font-size="14" fill="#f58a45" font-weight="600" text-anchor="middle">Deduplicate</text>
<text x="110" y="1010" font-size="10" fill="#a8b3c0" font-weight="400" text-anchor="middle">One route per site</text>
<rect x="204" y="966" width="172" height="58" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="290" y="989" font-size="14" fill="#f0f3f6" font-weight="600" text-anchor="middle">Unified results</text>
<text x="290" y="1010" font-size="10" fill="#a8b3c0" font-weight="400" text-anchor="middle">One consistent view</text>
<text x="200" y="1054" font-size="14" fill="#f58a45" font-weight="600" text-anchor="middle">Combined expertise. One unified search.</text>
