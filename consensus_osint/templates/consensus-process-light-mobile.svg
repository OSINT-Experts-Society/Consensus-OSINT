<text x="200" y="809" font-size="13" fill="#526171" font-weight="400" text-anchor="middle">New modules added. Broken modules retired.</text>
<text x="24" y="864" font-size="14" fill="#c65316" font-weight="700" text-anchor="start">HOW YOUR QUERY RUNS</text>
<text x="24" y="891" font-size="15" fill="#526171" font-weight="400" text-anchor="start">Default deduplicated search</text>
<rect x="24" y="914" width="352" height="88" rx="14" fill="#f6f8fa" stroke="#d5dce3" stroke-width="1"/>
<text x="200" y="950" font-size="22" fill="#18212b" font-weight="600" text-anchor="middle">Your query</text>
<text x="200" y="976" font-size="14" fill="#526171" font-weight="400" text-anchor="middle">Username / email / phone</text>
