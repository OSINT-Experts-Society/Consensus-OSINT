<text x="42" y="237" font-size="13" fill="#526171" font-weight="400" text-anchor="start">DetectDee</text>
<text x="42" y="255" font-size="13" fill="#526171" font-weight="400" text-anchor="start">Aliens Eye</text>
<text x="42" y="273" font-size="13" fill="#526171" font-weight="400" text-anchor="start">Nexfil</text>
<text x="218" y="111" font-size="13" fill="#526171" font-weight="400" text-anchor="start">GoSearch</text>
