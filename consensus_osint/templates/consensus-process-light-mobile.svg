<text x="200" y="1182" font-size="22" fill="#c65316" font-weight="600" text-anchor="middle">One search per site</text>
<text x="200" y="1208" font-size="14" fill="#526171" font-weight="400" text-anchor="middle">Duplicate routes removed</text>
<path d="M200 1241L200 1254" fill="none" stroke="#c65316" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="24" y="1262" width="352" height="88" rx="14" fill="#f6f8fa" stroke="#d5dce3" stroke-width="1"/>
<text x="200" y="1298" font-size="22" fill="#18212b" font-weight="600" text-anchor="middle">Unified results</text>
<text x="200" y="1324" font-size="14" fill="#526171" font-weight="400" text-anchor="middle">One consistent view of your findings</text>
<text x="200" y="1410" font-size="16" fill="#c65316" font-weight="600" text-anchor="middle">Combined expertise. One unified search.</text>
