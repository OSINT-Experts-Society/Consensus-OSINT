<svg xmlns="http://www.w3.org/2000/svg" width="400" height="1440" viewBox="0 0 400 1440" role="img" aria-labelledby="title desc">
<title id="title">How Consensus is built and how your query runs</title>
<desc id="desc">Nineteen source projects feed expert testing, improvement, standardisation and deduplication into Consensus. Weekly reviews add new modules and retire broken ones. Your query uses Consensus for one search per site in the default deduplicated scan, producing unified results.</desc>
<rect width="400" height="1440" rx="18" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#c65316" stroke-width="1.5"/></marker></defs>
<g font-family="Segoe UI, Helvetica, Arial, sans-serif">
