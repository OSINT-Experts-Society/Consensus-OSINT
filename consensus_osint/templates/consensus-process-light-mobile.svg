<rect x="24" y="54" width="352" height="246" rx="14" fill="#f6f8fa" stroke="#d5dce3" stroke-width="1"/>
<text x="42" y="84" font-size="19" fill="#18212b" font-weight="600" text-anchor="start">19 open-source projects</text>
