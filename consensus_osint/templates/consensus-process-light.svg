<svg xmlns="http://www.w3.org/2000/svg" width="920" height="590" viewBox="0 0 920 590" role="img" aria-labelledby="title desc">
<title id="title">How Consensus is built and how your query runs</title>
<desc id="desc">Nineteen source projects feed expert testing, improvement, standardisation and deduplication into Consensus. Weekly reviews add new modules and retire broken ones. Your query uses Consensus for one search per site in the default deduplicated scan, producing unified results.</desc>
