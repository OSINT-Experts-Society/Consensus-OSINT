<svg xmlns="http://www.w3.org/2000/svg" width="920" height="630" viewBox="0 0 920 630" role="img" aria-labelledby="title desc">
<title id="title">How Consensus combines and maintains 19 source projects</title>
<desc id="desc">Nineteen source projects listed 12,356 modules and rules in the 3 October snapshot, including overlaps. Consensus has 9,778 enabled modules and rules in the 16 October inventory after expert review, testing and integration. These are inventory snapshots, not measured batch throughput. Experts target a weekly review cadence. A default query selects relevant modules, removes duplicate routes and presents unified results.</desc>
<rect width="920" height="630" rx="18" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#c65316" stroke-width="1.5"/></marker></defs>
<g font-family="Segoe UI, Helvetica, Arial, sans-serif">
<text x="24" y="32" font-size="14" fill="#c65316" font-weight="700" text-anchor="start">HOW CONSENSUS WORKS</text>
<rect x="24" y="56" width="244" height="178" rx="12" fill="#f6f8fa" stroke="#d5dce3" stroke-width="1"/>
<rect x="338" y="56" width="244" height="178" rx="12" fill="#f6f8fa" stroke="#d5dce3" stroke-width="1"/>
<rect x="652" y="56" width="244" height="178" rx="12" fill="#f6f8fa" stroke="#c65316" stroke-width="2"/>
<text x="146" y="91" font-size="20" fill="#18212b" font-weight="650" text-anchor="middle">19 source projects</text>
<text x="146" y="143" font-size="36" fill="#c65316" font-weight="700" text-anchor="middle">12,356</text>
<text x="146" y="169" font-size="14" fill="#526171" font-weight="400" text-anchor="middle">listed modules and rules*</text>
<text x="146" y="202" font-size="13" fill="#526171" font-weight="400" text-anchor="middle">Includes overlapping routes</text>
<text x="356" y="90" font-size="20" fill="#18212b" font-weight="650" text-anchor="start">Expert review</text>
<text x="356" y="122" font-size="12" fill="#c65316" font-weight="700" text-anchor="start">01</text>
<text x="385" y="122" font-size="14" fill="#18212b" font-weight="400" text-anchor="start">Test and improve</text>
<text x="356" y="149" font-size="12" fill="#c65316" font-weight="700" text-anchor="start">02</text>
<text x="385" y="149" font-size="14" fill="#18212b" font-weight="400" text-anchor="start">Standardise results</text>
<text x="356" y="176" font-size="12" fill="#c65316" font-weight="700" text-anchor="start">03</text>
<text x="385" y="176" font-size="14" fill="#18212b" font-weight="400" text-anchor="start">Remove duplicates</text>
<text x="356" y="203" font-size="12" fill="#c65316" font-weight="700" text-anchor="start">04</text>
<text x="385" y="203" font-size="14" fill="#18212b" font-weight="400" text-anchor="start">Integrate modules</text>
<text x="774" y="91" font-size="20" fill="#18212b" font-weight="650" text-anchor="middle">Consensus</text>
<text x="774" y="143" font-size="36" fill="#c65316" font-weight="700" text-anchor="middle">9,778</text>
<text x="774" y="169" font-size="14" fill="#526171" font-weight="400" text-anchor="middle">enabled modules and rules</text>
<text x="774" y="202" font-size="13" fill="#18212b" font-weight="600" text-anchor="middle">One maintained tool</text>
<path d="M280 145L326 145" fill="none" stroke="#c65316" stroke-width="2" marker-end="url(#arrow)"/>
<text x="303" y="128" font-size="11" fill="#526171" font-weight="400" text-anchor="middle">evaluate</text>
