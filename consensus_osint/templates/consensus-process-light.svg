<text x="792" y="364" font-size="14" fill="#18212b" font-weight="600" text-anchor="middle">Update Consensus</text>
<text x="784" y="389" font-size="11" fill="#526171" font-weight="400" text-anchor="middle">Integrate and retire modules</text>
<text x="460" y="423" font-size="12" fill="#526171" font-weight="400" text-anchor="middle">New modules integrated. Broken modules retired.</text>
