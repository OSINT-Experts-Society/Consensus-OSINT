<text x="617" y="128" font-size="11" fill="#526171" font-weight="400" text-anchor="middle">integrate</text>
<text x="24" y="262" font-size="12" fill="#526171" font-weight="400" text-anchor="start">* Counts include overlaps and declared routes; Mailcat is separate and SherlockV2 is unverified.</text>
<text x="896" y="262" font-size="12" fill="#526171" font-weight="400" text-anchor="end">Snapshots: sources 3 Oct; Consensus 16 Oct 2026</text>
