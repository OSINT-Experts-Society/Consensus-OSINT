<text x="568" y="389" font-size="11" fill="#526171" font-weight="400" text-anchor="middle">Test, improve, deduplicate</text>
<path d="M669 374L681 374" fill="none" stroke="#c65316" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="688" y="339" width="192" height="70" rx="12" fill="#f6f8fa" stroke="#d5dce3" stroke-width="1"/>
