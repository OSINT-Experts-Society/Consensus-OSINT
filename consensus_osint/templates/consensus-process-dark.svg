<text x="617" y="128" font-size="11" fill="#a8b3c0" font-weight="400" text-anchor="middle">integrate</text>
<text x="24" y="262" font-size="12" fill="#a8b3c0" font-weight="400" text-anchor="start">* Counts include overlaps and declared routes; Mailcat is separate and SherlockV2 is unverified.</text>
<text x="896" y="262" font-size="12" fill="#a8b3c0" font-weight="400" text-anchor="end">Inventory snapshot: 3 October 2026</text>
