<text x="460" y="394" font-size="16" fill="#a8b3c0" font-weight="400" text-anchor="middle">New modules integrated. Broken modules retired.</text>
<text x="24" y="450" font-size="14" fill="#f58a45" font-weight="700" text-anchor="start">HOW YOUR QUERY RUNS</text>
<text x="896" y="450" font-size="14" fill="#a8b3c0" font-weight="400" text-anchor="end">Default deduplicated search</text>
