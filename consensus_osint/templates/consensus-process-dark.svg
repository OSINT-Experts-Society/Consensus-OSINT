<text x="146" y="169" font-size="14" fill="#a8b3c0" font-weight="400" text-anchor="middle">listed modules and rules*</text>
<text x="146" y="202" font-size="13" fill="#a8b3c0" font-weight="400" text-anchor="middle">Includes overlapping routes</text>
<text x="356" y="90" font-size="20" fill="#f0f3f6" font-weight="650" text-anchor="start">Expert review</text>
<text x="356" y="122" font-size="12" fill="#f58a45" font-weight="700" text-anchor="start">01</text>
<text x="385" y="122" font-size="14" fill="#f0f3f6" font-weight="400" text-anchor="start">Test and improve</text>
<text x="356" y="149" font-size="12" fill="#f58a45" font-weight="700" text-anchor="start">02</text>
<text x="385" y="149" font-size="14" fill="#f0f3f6" font-weight="400" text-anchor="start">Standardise results</text>
<text x="356" y="176" font-size="12" fill="#f58a45" font-weight="700" text-anchor="start">03</text>
<text x="385" y="176" font-size="14" fill="#f0f3f6" font-weight="400" text-anchor="start">Remove duplicates</text>
<text x="356" y="203" font-size="12" fill="#f58a45" font-weight="700" text-anchor="start">04</text>
<text x="385" y="203" font-size="14" fill="#f0f3f6" font-weight="400" text-anchor="start">Integrate modules</text>
<text x="774" y="91" font-size="20" fill="#f0f3f6" font-weight="650" text-anchor="middle">Consensus</text>
<text x="774" y="143" font-size="36" fill="#f58a45" font-weight="700" text-anchor="middle">7,989</text>
<text x="774" y="169" font-size="14" fill="#a8b3c0" font-weight="400" text-anchor="middle">enabled modules and rules</text>
<text x="774" y="202" font-size="13" fill="#f0f3f6" font-weight="600" text-anchor="middle">One maintained tool</text>
<path d="M280 145L326 145" fill="none" stroke="#f58a45" stroke-width="2" marker-end="url(#arrow)"/>
<text x="303" y="128" font-size="11" fill="#a8b3c0" font-weight="400" text-anchor="middle">evaluate</text>
