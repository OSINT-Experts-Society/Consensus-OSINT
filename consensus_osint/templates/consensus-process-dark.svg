<svg xmlns="http://www.w3.org/2000/svg" width="920" height="630" viewBox="0 0 920 630" role="img" aria-labelledby="title desc">
<title id="title">How Consensus combines and maintains 19 source projects</title>
<desc id="desc">Nineteen source projects list 12,356 modules and rules including overlaps. Expert review tests, improves, standardises and deduplicates candidates before 7,989 enabled modules and rules enter Consensus. Experts scan sources, identify changes, review candidates and update Consensus, targeting a weekly review cadence. A default query selects relevant modules, removes duplicate routes and presents unified results.</desc>
<rect width="920" height="630" rx="18" fill="#0d1117"/>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#f58a45" stroke-width="1.5"/></marker></defs>
<g font-family="Segoe UI, Helvetica, Arial, sans-serif">
<text x="24" y="32" font-size="14" fill="#f58a45" font-weight="700" text-anchor="start">HOW CONSENSUS WORKS</text>
<rect x="24" y="56" width="244" height="178" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="338" y="56" width="244" height="178" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
