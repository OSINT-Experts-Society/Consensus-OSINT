<svg xmlns="http://www.w3.org/2000/svg" width="920" height="880" viewBox="0 0 920 880" role="img" aria-labelledby="title desc">
<title id="title">From 19 projects to Consensus, maintained weekly</title>
<desc id="desc">Source catalogues list 12,356 modules and rules including overlaps, with Mailcat separate and SherlockV2 unverified. Expert evaluation feeds Consensus, whose current inventory has 7,989 enabled modules and rules. These are inventory snapshots, not measured batch throughput. Weekly process: horizon scan, identify new modules, expert review, update Consensus. Default queries select one search per site and produce unified results.</desc>
